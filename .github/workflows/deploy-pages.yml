name: Deploy Paham DNA to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'dist/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check exported game
        run: |
          test -f dist/index.html || { echo 'Missing dist/index.html'; exit 1; }
          find dist -maxdepth 1 -type f -name '*.wasm' | grep -q . || { echo 'Missing WASM export'; exit 1; }
          find dist -maxdepth 1 -type f -name '*.pck' | grep -q . || { echo 'Missing PCK export'; exit 1; }
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
